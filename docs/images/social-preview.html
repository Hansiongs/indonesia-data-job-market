<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Glints Job Intel — Social Preview</title>
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 1280px; height: 640px;
      background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #ffffff; overflow: hidden;
    }
    .frame { width: 1280px; height: 640px; box-sizing: border-box;
              padding: 64px 80px; position: relative; }
    .badge { display: inline-block; padding: 8px 16px; border-radius: 999px;
              background: rgba(255, 255, 255, 0.18); font-size: 22px;
              letter-spacing: 0.04em; text-transform: uppercase;
              backdrop-filter: blur(4px); }
    h1 { font-size: 72px; line-height: 1.1; margin: 24px 0 16px;
          font-weight: 800; max-width: 980px; }
    .tagline { font-size: 30px; opacity: 0.92; margin-bottom: 56px;
                max-width: 900px; font-weight: 400; }
    .stat { font-size: 26px; opacity: 0.95; margin-bottom: 12px;
             font-weight: 500; }
    .stat b { font-size: 38px; font-weight: 700; }
    .footer { position: absolute; bottom: 48px; left: 80px; right: 80px;
               display: flex; justify-content: space-between;
               font-size: 22px; opacity: 0.85; }
    .pill { background: rgba(255,255,255,0.15); padding: 6px 14px;
             border-radius: 8px; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="frame">
    <span class="badge">🇮🇩 Indonesia Data Jobs · 2026</span>
    <h1>Glints Job Intel</h1>
    <p class="tagline">Scraping, cleaning, and visualising Indonesia's data job market.</p>
    <div class="stat"><b>1,247</b> job postings analysed</div>
    <div class="stat"><b>Sql</b> — most in-demand skill (1,064 postings)</div>
    <div class="stat"><b>85%</b> of postings require <b>SQL</b></div>
    <div class="footer">
      <span><span class="pill">Python</span><span class="pill">Streamlit</span>
            <span class="pill">Playwright</span></span>
      <span>Synthetic dataset (demo)</span>
    </div>
  </div>
</body>
</html>
